  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

  .toast{position:fixed;left:50%;bottom:calc(46vh+14px);transform:translateX(-50%);

  .tutorial-text{font-size:12px;color:var(--txt);line-height:1.6;margin-bottom:12px;min-height:60px}
  .tutorial-text.typing{animation:typewriter 0.05s steps(1);}
  .tutorial-buttons{display:flex;gap:8px;margin-top:12px}
  .tutorial-btn{flex:1;padding:8px;border:none;border-radius:7px;font-weight:bold;font-size:11px;

  .tutorial-next:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a00}
  .tutorial-skip{background:#1a221b;color:var(--dim);border:1px solid var(--line)}
  .tutorial-skip:active{background:#252d26}

  @media(min-width:760px){#panel{max-height:40vh} .stat .val{font-size:17px}}
</style>

/* STATE */
function freshRun(){return{oil:0,runEarned:0,tapLvl:0,gen:{},def:{},unit:{},tech:{},wave:0,waveCleared:0,inWave:false,waveTimer:120,baseHP:100};}
function freshState(){

/* DERIVED CALCS */
function techMult(eff){let m=1;for(const k in S.tech){const tc=TECHS.find(x=>x.id===k);if(tc&&tc.eff===eff)m*=tc.val;}return m;}
function perkLvl(id){return S.perks[id]||0;}
function milestoneMult(){let m=1;if(S.rebirths>=1)m*=1.15;if(S.rebirths>=5)m*=1.25;if(S.rebirths>=10)m*=2.0;return m;}
function rebirthFlat(){return(1+0.15*S.rebirths)*milestoneMult();}
function ppMult(){return S.rebirths>=3?1.5:1.0;}
function oilMultiplier(){
  let gen=1;for(const d of DEFENSE){if(d.oilBonus)gen+=d.oilBonus*(S.def[d.id]||0);}
  return techMult("oil")*Math.pow(1.25,perkLvl("p_oil"))*rebirthFlat()*gen*boostMult();
}
function tapPower(){return(1+S.tapLvl)*techMult("tap")*Math.pow(3,perkLvl("p_tap"))*oilMultiplier();}
function tapUpgradeCost(){return Math.floor(25*Math.pow(1.5,S.tapLvl));}
function oilPerSecRaw(){let s=0;for(const g of GENERATORS)s+=(S.gen[g.id]||0)*g.prod;return s;}
function oilPerSec(){return oilPerSecRaw()*oilMultiplier();}
function killRewardMult(){let m=1+0.20*perkLvl("p_kill");if(S.rebirths>=2)m*=2;if(S.rebirths>=5)m*=2;return m;}
function totalDPS(){let s=0;for(const d of DEFENSE)s+=(S.def[d.id]||0)*d.dps;for(const u of UNITS)s+=(S.unit[u.id]||0)*u.dps;s=Math.max(s,1);return s*techMult("dps")*Math.pow(1.30,perkLvl("p_dps"))*(1+0.15*S.rebirths)*(S.rebirths>=10?2:1);}
function baseMaxHP(){let s=100;for(const d of DEFENSE)s+=(S.def[d.id]||0)*(d.hp||0);return s*techMult("hp")*Math.pow(1.30,perkLvl("p_hp"));}
function offlineCapHours(){return 4+2*perkLvl("p_off");}
function cmdCooldownBase(){return Math.max(30,CMD_COOLDOWN_BASE-20*perkLvl("p_cmd")-(S.rebirths>=2?20:0));}
function bulkCost(list,id,have,k){const it=list.find(x=>x.id===id),m=it.mult,b=it.cost*Math.pow(m,have);if(k<=0)return 0;return b*(Math.pow(m,k)-1)/(m-1);}
function maxAffordable(list,id,have){const it=list.find(x=>x.id===id),m=it.mult,b=it.cost*Math.pow(m,have);if(b>S.oil)return 0;const k=Math.floor(Math.log(S.oil*(m-1)/b+1)/Math.log(m));return Math.max(0,k);}
function ppGain(){if(S.runEarned<REBIRTH_REQ)return 0;const ratio=S.runEarned/REBIRTH_REQ;return Math.floor(5*Math.pow(ratio,0.5)*ppMult());}
function canWatchAd(){return Date.now()-S.lastAdWatch>=AD_COOLDOWN*1000;}
function adCooldownRemaining(){const wait=AD_COOLDOWN*1000-(Date.now()-S.lastAdWatch);return Math.max(0,wait/1000);}

/* INIT */
function init(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);musicGain=ctx.createGain();musicGain.gain.value=0.0;musicGain.connect(master);}catch(e){ctx=null;}}
  function ensure(){if(!ctx)init();if(ctx&&ctx.state==="suspended")ctx.resume();}
  function blip(freq,dur,type,vol,to){if(!ctx||!S.sound)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"square";o.frequency.value=freq;g.gain.value=0;g.gain.linearRampToValueAtTime(vol||0.2,ctx.currentTime+0.005);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);o.connect(g);g.connect(to||master);o.start();o.stop(ctx.currentTime+dur);}
  function noise(dur,vol,fc){if(!ctx||!S.sound)return;const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);n.buffer=buf;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=fc||1200;const g=ctx.createGain();g.gain.value=vol||0.3;n.connect(f);f.connect(g);g.connect(master);n.start();}
  function startMusic(){const scale=[110,146.8,164.8,196,220];let step=0;musicTimer=setInterval(()=>{if(!ctx||!S.music)return;const root=scale[step%scale.length];blip(root,1.6,"sine",0.5,musicGain);blip(root*2,1.2,"triangle",0.22,musicGain);if(step%2===0)blip(root*3,0.8,"sine",0.1,musicGain);step++;},1500);}
  function typewriter(){if(!ctx||!S.sound)return;for(let i=0;i<8;i++)setTimeout(()=>blip(200+Math.random()*400,0.05,"square",0.08),i*30);}
  return{
    resume:ensure,tap(){blip(360+Math.random()*60,0.07,"square",0.10);},buy(){ensure();blip(520,0.06,"square",0.16);setTimeout(()=>blip(780,0.08,"square",0.14),50);},
    money(){blip(880,0.05,"triangle",0.07);},shot(){noise(0.06,0.08,2500);},explode(){noise(0.35,0.35,500);blip(80,0.3,"sawtooth",0.16);},
    bigExplode(){noise(0.6,0.5,350);blip(55,0.5,"sawtooth",0.25);},alarm(){ensure();blip(440,0.18,"square",0.20);setTimeout(()=>blip(330,0.22,"square",0.20),200);},
    win(){ensure();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,"triangle",0.18),i*90));},chest(){ensure();[659,784,988,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.22,"triangle",0.20),i*80));},
    raid(){ensure();blip(160,0.5,"sawtooth",0.28);setTimeout(()=>blip(110,0.6,"sawtooth",0.28),150);},cmd(){ensure();[880,1100,1320].forEach((f,i)=>setTimeout(()=>blip(f,0.25,"triangle",0.22),i*60));},
    typewriter:typewriter,setMusic(on){ensure();if(!ctx)return;S.music=on;musicGain.gain.linearRampToValueAtTime(on?0.16:0.0,ctx.currentTime+0.5);if(on&&!musicTimer)startMusic();if(!on&&musicTimer){clearInterval(musicTimer);musicTimer=null;}}
  };
})();

/* RENDER & COMBAT (condensed, keeping main logic) */
const canvas=document.getElementById("scene");
const ctx2=canvas.getContext("2d");
let W=0,H=0,DPR=1,cx=0,cy=0,baseR=40;
function resize(){const r=canvas.parentElement.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx2.setTransform(DPR,0,0,DPR,0,0);ctx2.imageSmoothingEnabled=false;cx=W/2;cy=H*0.56;baseR=Math.max(32,Math.min(W,H)*0.13);}
window.addEventListener("resize",resize);
let enemies=[],projectiles=[],particles=[],floaters=[];
let shotTimer=0,pumpAnim=0;
function spawnEnemy(hp,type,boss){const props=ENEMY_PROPS[type]||ENEMY_PROPS.e_soldier;const ang=Math.random()*Math.PI*2;const rad=Math.max(W,H)*0.65;const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad*0.68;const baseSpd=26;enemies.push({x,y,hp,maxhp:hp,type,boss:!!boss,spd:baseSpd*props.spdM*(boss?0.7:1),d:9999,dmg:4*props.dmgM*Math.pow(1.16,S.wave),armor:props.armor||0,sz:props.sz||18});}
function getWaveEnemyPool(w){const cfg=getTier(w);const pool=cfg.pool.slice();if(w>30){pool.push(...pool.filter(t2=>ENEMY_PROPS[t2]&&(ENEMY_PROPS[t2].spdM>1.5||ENEMY_PROPS[t2].hpM>4)));}return pool;}
function startWave(){S.wave++;enemies=[];const cfg=getTier(S.wave);const isMega=S.wave%10===0;const isBoss=!isMega&&S.wave%5===0;const pool=getWaveEnemyPool(S.wave);const surge=S.wave%5===0?1.5:1.0;const baseCount=Math.floor((3+S.wave*0.9+cfg.cntAdd)*surge);const count=Math.min(baseCount,30);const hpBase=28*Math.pow(1.18,S.wave)*cfg.hpMult;for(let i=0;i<count;i++){const type=pool[Math.floor(Math.random()*pool.length)];const props=ENEMY_PROPS[type]||{hpM:1};const hp=hpBase*props.hpM*(0.7+Math.random()*0.6);spawnEnemy(hp,type,false);}if(isMega){const props=ENEMY_PROPS.e_megaboss;spawnEnemy(hpBase*count*4.0*props.hpM,"e_megaboss",true);}else if(isBoss){const props=ENEMY_PROPS.e_boss;spawnEnemy(hpBase*count*2.0*props.hpM,"e_boss",true);}S.inWave=true;const tname=tierName(cfg.tier);const alertTxt=isMega?t("bossIncoming")+` [${tname}]`:isBoss?t("bossIncoming")+` [${tname}]`:t("waveIncoming")+" "+S.wave+` [${tname}]`;showAlert(alertTxt);Audio.alarm();document.getElementById("tierBadge").textContent=tname+" · "+t("wave")+" "+S.wave;}
function killEnemy(e){const reward=e.maxhp*0.12*rebirthFlat()*killRewardMult();addOil(reward,e.x,e.y);if(e.boss){if(e.type==="e_megaboss"){S.megaBossKills++;Audio.bigExplode();shake(14);burst(e.x,e.y,60,"#ff8c00");}else{S.bossKills++;Audio.explode();shake(8);burst(e.x,e.y,40,"#ff8c00");}}else{Audio.explode();burst(e.x,e.y,Math.floor(e.sz/3),"#ffae5a");}}
function winWave(){S.inWave=false;S.waveCleared=Math.max(S.waveCleared,S.wave);S.waveTimer=120;const waveRewardMult=S.rebirths>=2?2:1;const bonus=(oilPerSec()*10+100)*waveRewardMult;addOil(bonus,cx,cy-baseR);showAlert(t("waveCleared")+" #"+S.wave);Audio.win();if(Math.random()<0.40)giveChest(0.6);checkMissions();}
function raid(){S.inWave=false;const lost=S.oil*0.12;S.oil=Math.max(0,S.oil-lost);S.baseHP=baseMaxHP();S.waveTimer=120;enemies=[];showAlert(t("raided"));flashRed();Audio.raid();shake(10);toast("-"+fmt(lost)+" 🛢️");}
function combatTick(dt){
  if(!S.inWave){S.waveTimer-=dt;const mhp=baseMaxHP();S.baseHP=Math.min(mhp,S.baseHP+mhp*0.06*dt);if(S.waveTimer<=0)startWave();return;}
  const dps=totalDPS();
  for(const e of enemies){const dx=cx-e.x,dy=cy-e.y,dist=Math.hypot(dx,dy);e.d=dist;if(dist>baseR+8){e.x+=dx/dist*e.spd*dt;e.y+=dy/dist*e.spd*dt;}else{S.baseHP-=e.dmg*dt;if(Math.random()<dt*5)burst(e.x,e.y,3,"#ff5050",1);}}
  enemies.sort((a,b)=>a.d-b.d);
  let dmgPool=dps*dt;
  for(const e of enemies){if(dmgPool<=0)break;const reduction=1-e.armor;const effective=Math.min(e.hp/reduction,dmgPool);e.hp-=effective*reduction;dmgPool-=effective;}
  shotTimer-=dt;
  if(shotTimer<=0&&enemies.length){shotTimer=0.09;const target=enemies[0];const slots=turretSlots();const n=Math.min(Math.floor(1+slots.length*0.4),4);for(let i=0;i<n;i++){const sp=slots[Math.floor(Math.random()*slots.length)];projectiles.push({x:sp.x,y:sp.y,tx:target.x,ty:target.y,t:0,life:0.20});burst(sp.x,sp.y,2,"#ffd24a",1);}Audio.shot();}
  const alive=[];
  for(const e of enemies){if(e.hp>0)alive.push(e);else killEnemy(e);}
  enemies=alive;
  if(S.baseHP<=0){raid();return;}
  if(enemies.length===0)winWave();
}
function turretSlots(){const n=Math.max(3,Math.min(10,2+(S.def.turret||0)+(S.def.hangar||0)));const arr=[];for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2-Math.PI/2;arr.push({x:cx+Math.cos(a)*baseR*0.95,y:cy+Math.sin(a)*baseR*0.65});}return arr;}
function burst(x,y,n,color,small){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(small?18:45)*Math.random()+8;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-18,life:0.5+Math.random()*0.4,max:0.9,color,size:small?2:2+Math.random()*3});}}
function smoke(x,y){particles.push({x,y,vx:(Math.random()-0.5)*8,vy:-12-Math.random()*8,life:1.2,max:1.2,color:"#5a5a5a",size:3,smoke:true});}
function addFloater(x,y,txt){floaters.push({x,y,txt,life:1.0});}
let shakeT=0,shakeMag=0;
function shake(m){shakeMag=m;shakeT=0.28;}
function flashRed(){const f=document.getElementById("flash");f.style.transition="none";f.style.opacity=0.6;requestAnimationFrame(()=>{f.style.transition="opacity .6s";f.style.opacity=0;});}
let alertT=0;
function showAlert(txt){const a=document.getElementById("alert");a.textContent=txt;a.classList.add("show");alertT=2.5;}
function render(dt){
  let ox=0,oy=0;
  if(shakeT>0){shakeT-=dt;ox=(Math.random()-0.5)*shakeMag;oy=(Math.random()-0.5)*shakeMag;}
  ctx2.save();ctx2.translate(ox,oy);
  const g=ctx2.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a1d18");g.addColorStop(0.4,"#2d2a1d");g.addColorStop(1,"#3a3320");
  ctx2.fillStyle=g;ctx2.fillRect(-20,-20,W+40,H+40);
  ctx2.fillStyle="rgba(0,0,0,.1)";
  for(let i=0;i<5;i++){const yy=H*0.18+i*H*0.15;ctx2.fillRect(0,yy,W,2);}
  ctx2.fillStyle="rgba(0,0,0,.3)";
  ctx2.beginPath();ctx2.ellipse(cx,cy+baseR*0.55,baseR*1.15,baseR*0.45,0,0,Math.PI*2);ctx2.fill();
  drawGenerators();
  const hqw=baseR*1.7,hqh=baseR*1.35;
  ctx2.drawImage(SPRITES.hq,cx-hqw/2,cy-hqh*0.72,hqw,hqh);
  const slots=turretSlots();
  for(const sp of slots){let ang=-Math.PI/2;if(enemies.length)ang=Math.atan2(enemies[0].y-sp.y,enemies[0].x-sp.x);ctx2.save();ctx2.translate(sp.x,sp.y);ctx2.rotate(ang+Math.PI/2);ctx2.drawImage(SPRITES.turret,-8,-8,16,16);ctx2.restore();}
  drawUnits();
  for(const e of enemies){const spr=SPRITES[e.type]||SPRITES.e_soldier;const w=e.sz,h=Math.floor(e.sz*0.8);ctx2.drawImage(spr,e.x-w/2,e.y-h/2,w,h);const bw=e.sz+4;ctx2.fillStyle="#000";ctx2.fillRect(e.x-bw/2,e.y-h/2-6,bw,3);ctx2.fillStyle=e.boss?"#ff8c00":e.armor>0?"#c8a020":"#ff4d4d";ctx2.fillRect(e.x-bw/2,e.y-h/2-6,bw*(e.hp/e.maxhp),3);if(e.armor>0){ctx2.fillStyle="rgba(255,200,0,.35)";ctx2.fillRect(e.x-w/2,e.y-h/2,w,h);}}
  ctx2.strokeStyle="#ffe08a";ctx2.lineWidth=2;ctx2.lineCap="round";
  for(const p of projectiles){const px2=p.x+(p.tx-p.x)*(p.t/p.life),py2=p.y+(p.ty-p.y)*(p.t/p.life);ctx2.beginPath();ctx2.moveTo(px2,py2);ctx2.lineTo(px2-(p.tx-p.x)*0.05,py2-(p.ty-p.y)*0.05);ctx2.stroke();}
  for(const pt of particles){ctx2.globalAlpha=Math.max(0,pt.life/pt.max);ctx2.fillStyle=pt.color;ctx2.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);}
  ctx2.globalAlpha=1;
  ctx2.font="bold 11px 'Courier New',monospace";ctx2.textAlign="center";
  for(const f of floaters){ctx2.globalAlpha=Math.max(0,f.life);ctx2.fillStyle="#ffd24a";ctx2.fillText(f.txt,f.x,f.y);}
  ctx2.globalAlpha=1;
  ctx2.restore();
}
function drawGenerators(){let ring=0,idx=0;for(const gdef of GENERATORS){const cnt=S.gen[gdef.id]||0;if(cnt<=0)continue;const show=Math.min(cnt,6);const rad=baseR*1.55+ring*24;for(let i=0;i<show;i++){const a=(i/Math.max(show,3))*Math.PI*2+idx*0.6+pumpAnim*0.015;const x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*0.6;const bob=Math.sin(pumpAnim*3+i)*1.5;ctx2.drawImage(SPRITES[gdef.sprite],x-8,y-8+bob,16,16);if(Math.random()<0.015)smoke(x,y-7);}ring++;idx++;}}
function drawUnits(){let placed=0;for(const u of UNITS){const cnt=S.unit[u.id]||0;if(cnt<=0)continue;const show=Math.min(cnt,4);for(let i=0;i<show;i++){const a=Math.PI/2+(placed-3)*0.3;const x=cx+Math.cos(a)*baseR*1.12,y=cy+Math.sin(a)*baseR*0.78+8;const spr=SPRITES[u.sprite];ctx2.drawImage(spr,x-spr.width/2,y-spr.height/2,spr.width,spr.height);placed++;if(placed>=8)return;}}}
function updateParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.smoke)p.vy+=115*dt;else p.vy-=6*dt;}particles=particles.filter(p=>p.life>0);if(particles.length>280)particles.splice(0,particles.length-280);for(const p of projectiles){p.t+=dt;if(p.t>=p.life)burst(p.tx,p.ty,3,"#ffae5a",1);}projectiles=projectiles.filter(p=>p.t<p.life);for(const f of floaters){f.life-=dt;f.y-=22*dt;}floaters=floaters.filter(f=>f.life>0);}

/* ECONOMY */
function addOil(amount,x,y){S.oil+=amount;S.runEarned+=amount;S.totalLifetime+=amount;if(x!==undefined&&amount>0&&Math.random()<0.45)addFloater(x,y,"+"+fmt(amount));}
function manualTap(px2,py2){const p=tapPower();addOil(p,px2,py2);burst(px2,py2,5,"#1a1410");burst(px2,py2,2,"#3a2a18",1);Audio.tap();Audio.money();}
function useCommanderAbility(){if(S.cmdCooldown>0||S.rebirths<1)return;const mult=3+Math.floor(S.rebirths*0.3);BOOSTS.push({mult,until:Date.now()+CMD_DURATION*1000});S.cmdCooldown=cmdCooldownBase();Audio.cmd();shake(4);toast("⚡ x"+mult+" ("+CMD_DURATION+"s)");}
function watchAd(){
  if(!canWatchAd()){toast("Ad cooldown: "+fmtTime(adCooldownRemaining()));return;}
  S.lastAdWatch=Date.now();
  const mult=3;BOOSTS.push({mult,until:Date.now()+AD_BOOST_DURATION*1000});
  Audio.buy();toast("🎬 x3 oil (10 min)");renderPanel();refreshHUD();
}
function buyFrom(list,store,id){const have=store[id]||0;let k=1;if(BUYMODE==="10")k=Math.min(10,maxAffordable(list,id,have));else if(BUYMODE==="max")k=maxAffordable(list,id,have);if(k<=0){toast("⚠ "+t("notEnough"));return;}const cost=bulkCost(list,id,have,k);if(S.oil<cost){toast("⚠ "+t("notEnough"));return;}S.oil-=cost;store[id]=have+k;Audio.buy();checkMissions();renderPanel();refreshHUD();}
function buyGen(id){buyFrom(GENERATORS,S.gen,id);}function buyDef(id){buyFrom(DEFENSE,S.def,id);}function buyUnit(id){buyFrom(UNITS,S.unit,id);}
function upgradeTap(){const c=tapUpgradeCost();if(S.oil<c){toast("⚠ "+t("notEnough"));return;}S.oil-=c;S.tapLvl++;Audio.buy();renderPanel();refreshHUD();}
function buyTech(id){const tc=TECHS.find(x=>x.id===id);if(!tc||S.tech[id])return;if(S.runEarned<tc.req||S.oil<tc.cost){toast("⚠ "+t("notEnough"));return;}S.oil-=tc.cost;S.tech[id]=true;Audio.buy();checkMissions();renderPanel();refreshHUD();}
function buyPerk(id){const lvl=perkLvl(id),cost=PERK_COST(lvl);if(S.pp<cost){toast("⚠ PP");return;}S.pp-=cost;S.perks[id]=lvl+1;Audio.buy();renderPanel();refreshHUD();}
function doRebirth(){const gain=ppGain();if(gain<=0)return;S.pp+=gain;S.rebirths++;const keep={lang:S.lang,sound:S.sound,music:S.music,rebirths:S.rebirths,pp:S.pp,perks:S.perks,bossKills:S.bossKills,megaBossKills:S.megaBossKills,missionsDone:S.missionsDone,lastDaily:S.lastDaily,totalLifetime:S.totalLifetime,tutorialDone:S.tutorialDone,lastAdWatch:S.lastAdWatch};S=Object.assign(freshRun(),keep,{lastSaved:Date.now()});enemies=[];projectiles=[];particles=[];BOOSTS=[];closeModal();Audio.win();checkMissions();switchTab("extract");refreshHUD();toast("+"+gain+" PP 🎖️");}
function giveChest(scaleMin){const mins=(scaleMin||1)*(2+Math.random()*8);const reward=Math.max(oilPerSec()*60*mins,100*Math.pow(2,S.rebirths));addOil(reward,cx,cy-baseR);if(Math.random()<0.45){const mult=2+Math.floor(Math.random()*3);BOOSTS.push({mult,until:Date.now()+90000});toast("⚡ x"+mult+" (90s)");}return reward;}
function checkMissions(){for(const m of MISSIONS)if(!S.missionsDone[m.id]&&m.chk(S)){}updateTabBadges();}
function claimMission(id){const m=MISSIONS.find(x=>x.id===id);if(!m||S.missionsDone[id]||!m.chk(S))return;S.missionsDone[id]=true;if(m.r>0)addOil(m.r,cx,cy-baseR);Audio.chest();toast(t("reward")+": +"+fmt(m.r)+" 🛢️");renderPanel();refreshHUD();updateTabBadges();}

  {selector:"#hud .stat.mult",title:{en:"Global Multiplier",es:"Multiplicador Global"},text:{en:"Your production multiplies by tech, upgrades, and prestige. Always growing!",es:"Tu producción se multiplica por tecnología y prestigio. ¡Siempre creciendo!"}},
  {selector:"#cmdBtn",title:{en:"Commander Ability",es:"Habilidad del Comandante"},text:{en:"(Unlocks at Rebirth 1) A powerful temporary boost. Great for tough waves!",es:"(Se desbloquea en Renacimiento 1) Potente impulso temporal. ¡Perfecto para oleadas!"}}
];

let tutorialIdx=0,tutorialActive=false;
function startTutorial(){tutorialActive=true;tutorialIdx=0;S.tutorialDone=true;showTutorialStep();}
function showTutorialStep(){
  if(tutorialIdx>=TUTORIAL_STEPS.length){closeTutorial();return;}
  const step=TUTORIAL_STEPS[tutorialIdx];
  const el=document.querySelector(step.selector);
  const title=step.title[LANG]||step.title.en;
  const text=step.text[LANG]||step.text.en;
  
  document.getElementById("tutorialTitle").textContent=title;
  document.getElementById("tutorialText").innerHTML=text;
  document.getElementById("tutorialOverlay").classList.add("show");
  
  // Draw commander
  const cp=document.getElementById("cmdPortrait");
  if(cp&&!SPRITES.commander){buildCommander();}if(SPRITES.commander){const g=cp.getContext("2d");g.imageSmoothingEnabled=false;g.clearRect(0,0,60,60);g.drawImage(SPRITES.commander,0,0,60,60);}
  
  // Highlight element
  if(el){const rect=el.getBoundingClientRect();const hig=document.getElementById("tutorialHighlight");hig.style.left=rect.left+"px";hig.style.top=rect.top+"px";hig.style.width=rect.width+"px";hig.style.height=rect.height+"px";hig.style.display="block";}
  
  // Typewriter sound
  Audio.typewriter();
}
function buildCommander(){makeSprite("commander",60,60,g=>{const steel="#5b6b73",dark="#2b3338",lite="#8fa1a8",gold="#ffd24a";px(g,10,5,40,20,"#8a7050");px(g,15,8,30,10,"#aaa080");px(g,18,12,24,6,"#e0d5a0");px(g,12,20,8,4,"#4a4a4a");px(g,40,20,8,4,"#4a4a4a");px(g,15,27,30,3,"#3a2a1a");px(g,10,30,10,8,"#5a5050");px(g,40,30,10,8,"#5a5050");px(g,8,15,4,8,gold);px(g,48,15,4,8,gold);px(g,20,38,20,4,"#6a5a3a");px(g,15,42,30,4,"#c0b070");px(g,25,47,10,8,"#3a3a3a");});}
function nextTutorialStep(){tutorialIdx++;showTutorialStep();}
function closeTutorial(){tutorialActive=false;document.getElementById("tutorialOverlay").classList.remove("show");document.getElementById("tutorialHighlight").style.display="none";}

/* UI */
let CURTAB="extract",BUYMODE="1";
const TABS=[{id:"extract",label:"tabExtract"},{id:"defense",label:"tabDefense"},{id:"units",label:"tabUnits"},{id:"tech",label:"tabTech"},{id:"missions",label:"tabMissions"},{id:"rebirth",label:"tabRebirth"}];
function buildTabs(){const el=document.getElementById("tabs");el.innerHTML="";for(const tb of TABS){const b=document.createElement("button");b.className="tab"+(tb.id===CURTAB?" active":"");b.dataset.id=tb.id;b.innerHTML=`<span>${t(tb.label)}</span><span class="badge" data-badge="${tb.id}" style="display:none"></span>`;b.onclick=()=>switchTab(tb.id);el.appendChild(b);}updateTabBadges();}
function switchTab(id){CURTAB=id;document.querySelectorAll(".tab").forEach(t2=>t2.classList.toggle("active",t2.dataset.id===id));renderPanel();}
function updateTabBadges(){let mc=0;for(const m of MISSIONS)if(!S.missionsDone[m.id]&&m.chk(S))mc++;document.querySelectorAll("[data-badge]").forEach(b=>{if(b.dataset.badge==="missions"&&mc>0){b.style.display="inline-block";b.textContent=mc;}else b.style.display="none";});}
function priceBtn(cost,onclick,label){const can=S.oil>=cost;return `<button class="buy ${can?"":"cant"}" data-act="${onclick}">${label||t("buy")}<span class="c">${fmt(cost)} 🛢️</span></button>`;}
function buyCountDisplay(list,id,have){if(BUYMODE==="1")return 1;if(BUYMODE==="10")return Math.max(1,Math.min(10,maxAffordable(list,id,have)));return Math.max(1,maxAffordable(list,id,have));}
function card(spr,nameHtml,subHtml,btnHtml,extraClass){return `<div class="card ${extraClass||""}"><canvas class="spr" width="16" height="16" data-spr="${spr}"></canvas><div class="info"><div class="nm">${nameHtml}</div><div class="sub">${subHtml}</div></div>${btnHtml}</div>`;}

function renderPanel(){
  const c=document.getElementById("content");let html="";
  if(CURTAB==="extract"){
    html+=`<div class="section-note">${t("extractNote")}</div>`;
    const tc=tapUpgradeCost();
    html+=card("pump",t("upgradeTap")+` <span class="owned-pill">Lv.${S.tapLvl}</span>`,"<b>+"+fmt(tapPower())+"</b> "+t("each"),priceBtn(tc,"tap","+1"));
    for(const g of GENERATORS){const have=S.gen[g.id]||0,k=buyCountDisplay(GENERATORS,g.id,have);const cost=bulkCost(GENERATORS,g.id,have,k);const sub=`<span class="owned-pill">${have}</span><b>+${fmt(g.prod*oilMultiplier())}</b>/s`;html+=card(g.sprite,g.name[LANG]||g.name.es,sub,priceBtn(cost,"gen:"+g.id,t("buy")+(k>1?` x${k}`:"")))}
    // AD REWARDS CARD
    const canAd=canWatchAd();const wait=canAd?0:adCooldownRemaining();
    html+=`<div class="ad-card"><div class="ad-title">🎬 ${t("adRewardTitle")}</div><div class="ad-desc">${t("adRewardDesc")}</div>
      <button class="ad-btn ${canAd?"":"cooldown"}" ${canAd?'data-act="ad"':''}>${canAd?t("adRewardBtn"):fmtTime(wait)}</button></div>`;
  }else if(CURTAB==="defense"){
    html+=`<div class="section-note">${t("defenseNote")}</div>`;
    for(const d of DEFENSE){const have=S.def[d.id]||0,k=buyCountDisplay(DEFENSE,d.id,have);const cost=bulkCost(DEFENSE,d.id,have,k);const bits=[`<span class="owned-pill">${have}</span>`];if(d.dps)bits.push(`<b>+${fmt(d.dps*techMult("dps"))}</b>${t("dmg")}`);if(d.hp)bits.push(`+${fmt(d.hp*techMult("hp"))}${t("hp")}`);if(d.oilBonus)bits.push(`+${Math.round(d.oilBonus*100)}%🛢️`);html+=card(d.sprite,d.name[LANG]||d.name.es,bits.join(" "),priceBtn(cost,"def:"+d.id,t("buy")+(k>1?` x${k}`:"")));}
  }else if(CURTAB==="units"){
    html+=`<div class="section-note">${t("unitsNote")}</div>`;
    for(const u of UNITS){const have=S.unit[u.id]||0,k=buyCountDisplay(UNITS,u.id,have);const cost=bulkCost(UNITS,u.id,have,k);const sub=`<span class="owned-pill">${have}</span><b>+${fmt(u.dps*techMult("dps"))}</b>${t("dmg")}`;html+=card(u.sprite,u.name[LANG]||u.name.es,sub,priceBtn(cost,"unit:"+u.id,t("buy")+(k>1?` x${k}`:"")))}
  }else if(CURTAB==="tech"){
    html+=`<div class="section-note">${t("techNote")}</div>`;
    for(const tech of TECHS){const done=!!S.tech[tech.id],unlocked=S.runEarned>=tech.req;const label={oil:"🛢️ x"+tech.val,tap:"⛏️ x"+tech.val,hp:"🛡️ x"+tech.val,dps:"💥 x"+tech.val}[tech.eff];let btn;if(done)btn=`<button class="buy" style="background:#1d4427;color:#5dff8f;box-shadow:0 3px 0 #0c2113">✓</button>`;else if(!unlocked)btn=`<button class="buy cant">${t("locked")}<span class="c">${fmt(tech.req)}🛢️</span></button>`;else btn=priceBtn(tech.cost,"tech:"+tech.id,t("buy"));html+=card("genpow",tech.name[LANG]||tech.name.es,label,btn,done?"done":(unlocked?"":"locked"));}
  }else if(CURTAB==="missions"){
    let any=false;
    for(const m of MISSIONS){const done=!!S.missionsDone[m.id],ready=!done&&m.chk(S);any=any||!done;let btn;if(done)btn=`<button class="buy" style="background:#1d4427;color:#5dff8f;box-shadow:0 3px 0 #0c2113">✓</button>`;else if(ready)btn=`<button class="buy" data-act="mission:${m.id}">${t("claim")}<span class="c">+${fmt(m.r)}🛢️</span></button>`;else btn=`<button class="buy cant">${t("reward")}<span class="c">+${fmt(m.r)}🛢️</span></button>`;html+=card(ready?"quantum":"radar",m.d[LANG]||m.d.es,done?"✓":ready?"⭐":"",btn,done?"done":"");}
    if(!any)html+=`<div class="section-note">${t("noMissions")}</div>`;
  }else if(CURTAB==="rebirth"){
    const gain=ppGain();
    html+=`<div class="card" style="flex-direction:column;align-items:stretch;gap:4px"><div class="nm" style="color:#ffd24a">⚔️ ${t("rebirthTitle")}</div><div class="sub">${t("rebirthDesc")}</div></div>`;
    html+=`<div class="card"><div class="info"><div class="nm">${t("pp")}: <b style="color:#ffd24a">${S.pp}</b></div><div class="sub">${t("rebirths")}: ${S.rebirths}</div></div></div>`;
    if(S.runEarned>=REBIRTH_REQ){html+=`<button class="big-btn green" data-act="rebirth">${t("rebirthBtn")} · +${gain} PP</button>`;}else{html+=`<button class="big-btn dis">${(rebirthNeedStr[LANG]||rebirthNeedStr.en).replace("{x}",fmt(REBIRTH_REQ))}</button>`;html+=`<div style="margin:4px 0 8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px"><span>${fmt(S.runEarned)} / ${fmt(REBIRTH_REQ)}</span></div><div style="height:8px;background:#0a0f0a;border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.min(100,S.runEarned/REBIRTH_REQ*100)}%;background:linear-gradient(90deg,#ffd24a,#ff8c00);transition:width .3s"></div></div></div>`;}
  }
  c.innerHTML=html;
  c.querySelectorAll("[data-spr]").forEach(cv=>{const s=SPRITES[cv.dataset.spr];if(!s)return;const g=cv.getContext("2d");g.imageSmoothingEnabled=false;g.clearRect(0,0,16,16);g.drawImage(s,0,0,16,16);});
  c.querySelectorAll("[data-act]").forEach(b=>{b.onclick=()=>{const a=b.dataset.act;if(a==="ad")watchAd();else if(a==="tap")upgradeTap();else if(a==="rebirth")confirmRebirth();else if(a.startsWith("gen:"))buyGen(a.slice(4));else if(a.startsWith("def:"))buyDef(a.slice(4));else if(a.startsWith("unit:"))buyUnit(a.slice(5));else if(a.startsWith("tech:"))buyTech(a.slice(5));else if(a.startsWith("perk:"))buyPerk(a.slice(5));else if(a.startsWith("mission:"))claimMission(a.slice(8));};});
}

let hudAcc=0,panelAcc=0;
function refreshHUD(){
  document.getElementById("hOil").textContent=fmt(S.oil)+" 🛢️";
  document.getElementById("hRate").textContent=fmt(oilPerSec())+"/s";
  document.getElementById("hMult").textContent="x"+fmt(oilMultiplier());
  document.getElementById("hWave").textContent=S.inWave?(S.wave+"⚔"):(S.wave>0?S.wave:"—");
  const hp=Math.max(0,S.baseHP),mhp=baseMaxHP(),pct=Math.max(0,Math.min(100,hp/mhp*100));
  document.getElementById("hHpFill").style.width=pct+"%";
  const th=document.getElementById("tapHint");
  if(!S.inWave&&S.wave>0)th.textContent=t("nextWave").replace("{x}",Math.ceil(S.waveTimer));else if(S.inWave)th.textContent=t("totalDps")+": "+fmt(totalDPS());else th.textContent=t("tapHint");
  const bx=document.getElementById("boosts");const now=Date.now();
  BOOSTS=BOOSTS.filter(b=>b.until>now);
  bx.innerHTML=BOOSTS.map(b=>`<span class="boost-tag">⚡x${b.mult} ${Math.ceil((b.until-now)/1000)}s</span>`).join("");
  const cb=document.getElementById("cmdBtn");
  if(S.rebirths>=1){cb.style.display="flex";if(S.cmdCooldown<=0){cb.className="icon-btn on ready";cb.innerHTML=`⚡ READY`;cb.style.width="auto";cb.style.padding="3px 10px";}else{cb.className="icon-btn";cb.innerHTML=`⚡ ${Math.ceil(S.cmdCooldown)}s`;cb.style.width="auto";cb.style.padding="3px 8px";}}else{cb.style.display="none";}
}

function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");}
function confirmRebirth(){openModal(`<h2>⚔️ ${t("rebirthTitle")}</h2><p>${t("rebirthConfirm")}</p><p>${t("rebirthGain")}: <span class="num">+${ppGain()} PP</span></p><div class="row"><button class="big-btn ghost" onclick="closeModal()">${t("cancel")}</button><button class="big-btn" id="doRb">${t("rebirthBtn")}</button></div>`);document.getElementById("doRb").onclick=doRebirth;}
function openSettings(){openModal(`<h2>⚙ ${t("settings")}</h2><div class="card"><div class="info"><div class="nm">🌐 Idioma / Language</div></div><button class="buy" id="mLang">${LANG==="en"?"Español":"English"}</button></div><div class="card"><div class="info"><div class="nm">🔊 ${t("sound")}</div></div><button class="buy ${S.sound?"":"cant"}" id="mSound">${S.sound?"ON":"OFF"}</button></div><div class="card"><div class="info"><div class="nm">🎵 ${t("music")}</div></div><button class="buy ${S.music?"":"cant"}" id="mMusic">${S.music?"ON":"OFF"}</button></div><button class="big-btn" id="mTut">📖 ${t("tutorial")}</button><button class="big-btn" id="mSave">💾 ${t("save")}</button><button class="big-btn ghost" id="mReset" style="margin-top:7px;color:#ff6b6b">🗑️ ${t("reset")}</button><div class="section-note" style="margin-top:10px">${t("credits")}</div><button class="big-btn ghost" onclick="closeModal()" style="margin-top:7px">${t("close")}</button>`);document.getElementById("mLang").onclick=()=>{setLang(LANG==="en"?"es":"en");openSettings();};document.getElementById("mSound").onclick=()=>{S.sound=!S.sound;document.getElementById("bSound").textContent=S.sound?"🔊":"🔇";document.getElementById("bSound").classList.toggle("on",S.sound);openSettings();};document.getElementById("mMusic").onclick=()=>{Audio.setMusic(!S.music);openSettings();};document.getElementById("mTut").onclick=()=>{closeModal();startTutorial();};document.getElementById("mSave").onclick=()=>{save();toast(t("saved"));};document.getElementById("mReset").onclick=()=>{openModal(`<h2>🗑️ ${t("reset")}</h2><p>${t("resetQ")}</p><div class="row"><button class="big-btn ghost" onclick="closeModal()">${t("cancel")}</button><button class="big-btn red" id="rcfm">${t("yes")}</button></div>`);document.getElementById("rcfm").onclick=()=>wipe();};}

function setLang(l){LANG=l;S.lang=l;document.documentElement.lang=l;document.getElementById("bLang").textContent=l.toUpperCase();document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));buildTabs();renderPanel();refreshHUD();}

let toastT=0;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");toastT=2.2;}

/* SAVE / LOAD */
const SAVE_KEY="DEFTYCOON_v3";
let storageOK=true;
function save(){S.lastSaved=Date.now();S.lang=LANG;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function load(){let raw=null;try{raw=localStorage.getItem(SAVE_KEY);}catch(e){storageOK=false;}if(!raw)return false;try{const d=JSON.parse(raw);S=Object.assign(freshState(),d);S.gen=S.gen||{};S.def=S.def||{};S.unit=S.unit||{};S.tech=S.tech||{};S.perks=S.perks||{};S.missionsDone=S.missionsDone||{};LANG=S.lang||"en";const now=Date.now(),dtOff=Math.min((now-(S.lastSaved||now))/1000,offlineCapHours()*3600);if(dtOff>30){const earn=oilPerSec()*dtOff*0.5;if(earn>1)pendingOffline={earn,dt:dtOff};}S.inWave=false;S.baseHP=Math.min(S.baseHP||100,baseMaxHP());if(!S.cmdCooldown)S.cmdCooldown=0;return true;}catch(e){return false;}}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=freshState();BOOSTS=[];enemies=[];projectiles=[];particles=[];closeTutorial();closeModal();setLang("en");switchTab("extract");refreshHUD();save();setTimeout(()=>startTutorial(),300);}
let pendingOffline=null;

/* INPUT */
function stagePoint(ev){const r=canvas.getBoundingClientRect();const e=ev.touches?ev.touches[0]||ev.changedTouches[0]:ev;return{x:e.clientX-r.left,y:e.clientY-r.top};}
function onTap(ev){ev.preventDefault();Audio.resume();const p=stagePoint(ev);manualTap(p.x,p.y);}
canvas.addEventListener("touchstart",onTap,{passive:false});
canvas.addEventListener("mousedown",e=>{if(e.button===0)onTap(e);});
document.getElementById("bLang").onclick=()=>{Audio.resume();setLang(LANG==="en"?"es":"en");};
document.getElementById("bSound").onclick=()=>{Audio.resume();S.sound=!S.sound;const b=document.getElementById("bSound");b.textContent=S.sound?"🔊":"🔇";b.classList.toggle("on",S.sound);};
document.getElementById("bMenu").onclick=()=>{Audio.resume();openSettings();};
document.getElementById("cmdBtn").onclick=()=>{Audio.resume();useCommanderAbility();};
document.querySelectorAll(".bm").forEach(b=>b.onclick=()=>{BUYMODE=b.dataset.bm;document.querySelectorAll(".bm").forEach(x=>x.classList.toggle("active",x===b));renderPanel();});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.getElementById("tutorialOverlay").addEventListener("click",e=>{if(e.target.id==="tutorialOverlay")closeTutorial();});
document.getElementById("tutorialNext").onclick=nextTutorialStep;
document.getElementById("tutorialSkip").onclick=closeTutorial;
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
window.addEventListener("beforeunload",save);
document.body.addEventListener("touchstart",()=>Audio.resume(),{once:true});
document.body.addEventListener("mousedown",()=>Audio.resume(),{once:true});

/* MAIN LOOP */
let last=performance.now(),saveAcc=0;
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;
  pumpAnim+=dt;
  addOil(oilPerSec()*dt);
  if(S.cmdCooldown>0)S.cmdCooldown=Math.max(0,S.cmdCooldown-dt);
  combatTick(dt);
  updateParticles(dt);
  if(alertT>0){alertT-=dt;if(alertT<=0)document.getElementById("alert").classList.remove("show");}
  if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById("toast").classList.remove("show");}
  render(dt);
  hudAcc+=dt;if(hudAcc>0.1){hudAcc=0;refreshHUD();}
  panelAcc+=dt;if(panelAcc>3.0){panelAcc=0;renderPanel();}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(loop);
}

/* INIT */

/* AD MODAL FOR REBIRTH */
let adModalShowing = false;
function showRebirthAd(){
  if(adModalShowing)return;
  adModalShowing=true;
  const modal=document.getElementById("adModal");
  modal.style.display="flex";
  Audio.buy();
  let countdown=5;
  document.getElementById("adTimer").textContent=countdown;
  const timer=setInterval(()=>{
    countdown--;
    document.getElementById("adTimer").textContent=countdown;
    if(countdown<=0){
      clearInterval(timer);
      modal.style.display="none";
      adModalShowing=false;
      // Give bonus: 10% extra oil
      const bonus=S.runEarned*0.10;
      addOil(bonus,cx,cy);
      toast("🎬 +10% bonus oil!");
      completeRebirth();
    }
  },1000);
}
function completeRebirth(){
  const gain=ppGain();if(gain<=0)return;
  S.pp+=gain;S.rebirths++;
  const keep={lang:S.lang,sound:S.sound,music:S.music,rebirths:S.rebirths,pp:S.pp,perks:S.perks,
    bossKills:S.bossKills,megaBossKills:S.megaBossKills,missionsDone:S.missionsDone,
    lastDaily:S.lastDaily,totalLifetime:S.totalLifetime,tutorialDone:S.tutorialDone,lastAdWatch:S.lastAdWatch};
  S=Object.assign(freshRun(),keep,{lastSaved:Date.now()});
  enemies=[];projectiles=[];particles=[];BOOSTS=[];
  closeModal();Audio.win();checkMissions();switchTab("extract");refreshHUD();
  toast("+"+gain+" PP 🎖️");
}

/* INIT */
function init(){
  buildSprites();resize();
  const loaded=load();
  if(LANG!=="en"&&LANG!=="es")LANG="en";
  setLang(LANG);
  if(!S.sound){document.getElementById("bSound").textContent="🔇";document.getElementById("bSound").classList.remove("on");}
  buildTabs();switchTab("extract");refreshHUD();
  if(!loaded)S.waveTimer=30;
  if(S.wave===0&&S.waveTimer>120)S.waveTimer=120;
  if(!S.tutorialDone)setTimeout(()=>startTutorial(),800);
  if(!storageOK)setTimeout(()=>toast("⚠ Download .html to save"),900);
  requestAnimationFrame(loop);
}
