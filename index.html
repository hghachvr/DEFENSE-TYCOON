<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e0a">
<title>Defense Tycoon</title>
<style>
  :root{
    --bg:#070a08; --panel:#0e1410; --panel2:#131b15; --line:#1f2c22;
    --amber:#ffb627; --amber2:#ff8c00; --green:#5dff8f; --green2:#1fae4d;
    --red:#ff4d4d; --blue:#39c0ff; --txt:#d8e6d8; --dim:#7e927e; --gold:#ffd24a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--txt);
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  /* HUD */
  #hud{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;
    background:linear-gradient(180deg,#0d130e,#0a0f0a);border-bottom:2px solid var(--line);z-index:5}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:4px 8px;min-width:0;flex:1 1 auto;display:flex;flex-direction:column;line-height:1.1}
  .stat .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .stat .val{font-size:15px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Courier New',monospace}
  .stat.oil .val{color:var(--amber)} .stat.rate .val{color:var(--green)}
  .stat.mult .val{color:var(--gold)} .stat.wave .val{color:var(--blue)}
  .hp-wrap{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  .hp-top{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);text-transform:uppercase}
  .hp-bar{height:7px;margin-top:2px;background:#000;border-radius:4px;overflow:hidden}
  .hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#2bd05a,#5dff8f);transition:width .2s}
  #hud .tools{display:flex;gap:5px;align-items:stretch;flex:0 0 auto}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;width:40px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn.on{border-color:var(--green);color:var(--green)}
  /* Commander ability */
  #cmdBtn{display:none;background:linear-gradient(180deg,#2a6e2a,#1a4a1a);border:1px solid var(--green);
    color:var(--green);border-radius:7px;padding:3px 10px;font-size:11px;font-weight:bold;
    cursor:pointer;white-space:nowrap;align-items:center;justify-content:center;flex-direction:column;line-height:1.2}
  #cmdBtn.ready{background:linear-gradient(180deg,#5dff8f22,#3aff6a11);border-color:#5dff8f;animation:cmdpulse 1.5s infinite}
  @keyframes cmdpulse{50%{box-shadow:0 0 10px #5dff8f66}}
  /* Scene */
  #stage{flex:1 1 auto;position:relative;overflow:hidden;min-height:100px}
  #scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #tapHint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:10px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000;text-align:center}
  #alert{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(255,77,77,.15);border:1px solid var(--red);color:var(--red);
    padding:5px 14px;border-radius:18px;font-weight:bold;font-size:12px;letter-spacing:1px;
    pointer-events:none;opacity:0;transition:opacity .3s;text-transform:uppercase;white-space:nowrap}
  #alert.show{opacity:1;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  #flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none}
  #tierBadge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid var(--line);
    color:var(--dim);font-size:9px;padding:2px 8px;border-radius:10px;pointer-events:none;text-transform:uppercase}
  /* Panel */
  #panel{flex:0 0 auto;background:var(--panel);border-top:2px solid var(--line);
    display:flex;flex-direction:column;max-height:46vh;z-index:5}
  #tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    background:none;border:none;color:var(--dim);cursor:pointer;white-space:nowrap;font-weight:bold;
    border-bottom:2px solid transparent}
  .tab.active{color:var(--amber);border-bottom-color:var(--amber);background:rgba(255,182,39,.06)}
  .tab .badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;
    font-size:8px;padding:0 4px;margin-left:3px;vertical-align:middle}
  #buymode{display:flex;gap:4px;padding:5px 8px 0;align-items:center}
  #buymode .lbl{font-size:9px;color:var(--dim);margin-right:auto}
  .bm{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:5px;padding:3px 10px;font-size:10px;font-weight:bold;cursor:pointer}
  .bm.active{border-color:var(--amber);color:var(--amber)}
  #content{overflow-y:auto;padding:7px 8px 12px;-webkit-overflow-scrolling:touch}
  /* Cards */
  .card{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;padding:7px;margin-bottom:6px}
  .card .spr{width:40px;height:40px;flex:0 0 40px;border-radius:6px;background:#0a0f0a;
    image-rendering:pixelated;border:1px solid var(--line)}
  .card .info{flex:1 1 auto;min-width:0}
  .card .nm{font-weight:bold;font-size:12px}
  .card .sub{font-size:10px;color:var(--dim);margin-top:1px}
  .card .sub b{color:var(--green)}
  .buy{flex:0 0 auto;min-width:80px;text-align:center;border:none;border-radius:7px;
    padding:7px 8px;font-weight:bold;font-size:11px;cursor:pointer;color:#0a0f0a;
    background:linear-gradient(180deg,var(--amber),var(--amber2));box-shadow:0 3px 0 #8a5a00}
  .buy:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a00}
  .buy.cant{background:#26302a;color:#4a5a4a;box-shadow:0 3px 0 #11160f;cursor:default}
  .buy .c{display:block;font-size:9px;opacity:.85;margin-top:1px}
  .owned-pill{font-size:9px;color:var(--gold);background:#000;border-radius:5px;padding:1px 5px;margin-right:3px}
  .card.locked{opacity:.5}
  .section-note{font-size:10px;color:var(--dim);margin:2px 0 8px;line-height:1.4}
  .big-btn{display:block;width:100%;border:none;border-radius:10px;padding:12px;
    font-size:14px;font-weight:bold;cursor:pointer;color:#0a0f0a;margin-top:7px;
    background:linear-gradient(180deg,var(--gold),#e0a200);box-shadow:0 4px 0 #9c6b00;
    text-transform:uppercase;letter-spacing:1px}
  .big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c6b00}
  .big-btn.dis{background:#26302a;color:#4a5a4a;box-shadow:0 4px 0 #11160f;cursor:default}
  .big-btn.red{background:linear-gradient(180deg,#ff6b6b,#c0392b);box-shadow:0 4px 0 #7a1f1f;color:#fff}
  /* Milestone table */
  .milestone{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
  .milestone .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 10px}
  .milestone .dot.done{background:var(--green)}
  .milestone .dot.next{background:var(--amber);animation:pulse 1s infinite}
  /* Modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px}
  #modal.show{display:flex}
  .box{background:var(--panel);border:2px solid var(--line);border-radius:14px;
    padding:16px;max-width:370px;width:100%;max-height:88vh;overflow-y:auto}
  .box h2{font-size:16px;color:var(--amber);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
  .box p{font-size:12px;color:var(--txt);line-height:1.5;margin:6px 0}
  .box .num{color:var(--gold);font-weight:bold;font-size:20px}
  .row{display:flex;gap:7px;margin-top:10px}
  .row .big-btn{margin-top:0}
  .ghost{background:#1a221b!important;color:var(--dim)!important;box-shadow:0 4px 0 #0a0f0a!important}
  .toast{position:fixed;left:50%;bottom:calc(46vh+14px);transform:translateX(-50%);
    background:#10301a;border:1px solid var(--green2);color:var(--green);padding:6px 14px;
    border-radius:18px;font-size:11px;font-weight:bold;z-index:60;opacity:0;
    transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  #boosts{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .boost-tag{display:inline-flex;align-items:center;gap:3px;background:#3a2a00;
    border:1px solid var(--amber);color:var(--amber);border-radius:7px;padding:2px 7px;font-size:10px;font-weight:bold}
  @media(min-width:760px){#panel{max-height:40vh} .stat .val{font-size:17px}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="stat oil"><span class="lbl" data-t="oil">Petróleo</span><span class="val" id="hOil">0</span></div>

    <div id="boosts"></div>
    <div id="alert"></div>
    <div id="flash"></div>
    <div id="tapHint"></div>
  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="buymode">

</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

let LANG="es";
function t(k){const o=STR[k];return o?(o[LANG]||o.es):k;}
function nm(o){return o[LANG]||o.es;}
function tierName(i){const arr=STR.tierNames[LANG]||STR.tierNames.es;return arr[Math.min(i,arr.length-1)];}

/* ---- number format ---- */
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","UDc","DDc"];
function fmt(n){
  if(!isFinite(n))return"∞";
  n=Math.max(0,n);
  if(n<1000)return(n>=100?Math.floor(n):Math.floor(n*10)/10).toString().replace(/\.0$/,"");
  const tier=Math.floor(Math.log10(n)/3);
  if(tier<SUF.length){const v=n/Math.pow(1000,tier);return(Math.floor(v*100)/100)+SUF[tier];}
  return n.toExponential(2).replace("e+","e");
}
function fmtTime(s){
  s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  if(h>0)return h+"h "+m+"m";if(m>0)return m+"m "+sc+"s";return sc+"s";
}

/* ---- WAVE TIER CONFIG ---- */
const WAVE_TIERS=[
  {minW:1,  maxW:5,  tier:0, hpMult:1.0, cntAdd:0, pool:["e_soldier","e_soldier","e_drone"]},

function getTier(w){return WAVE_TIERS.find(t2=>w>=t2.minW&&w<=t2.maxW)||WAVE_TIERS[WAVE_TIERS.length-1];}

/* ---- GAME DATA ---- */
const GENERATORS=[
  {id:"pump",    name:{es:"Bomba de Petróleo",en:"Oil Pump"},      cost:15,    mult:1.13,prod:0.3,  sprite:"pump"},
  {id:"derrick", name:{es:"Torre de Perforación",en:"Oil Derrick"},cost:220,   mult:1.14,prod:3,    sprite:"derrick"},

  {id:"platform",name:{es:"Plataforma Marina",en:"Offshore Rig"},  cost:8.5e5, mult:1.17,prod:1100, sprite:"platform"},

  {id:"fusion",  name:{es:"Reactor de Síntesis",en:"Synthesis Reactor"},cost:2.6e8,mult:1.19,prod:62000,sprite:"fusion"},

/* ---- STATE ---- */
function freshRun(){
  return{oil:0,runEarned:0,tapLvl:0,gen:{},def:{},unit:{},tech:{},
    wave:0,waveCleared:0,inWave:false,waveTimer:120,baseHP:100};
}
function freshState(){
  return Object.assign(freshRun(),{
    lang:"es",sound:true,music:false,
    rebirths:0,pp:0,perks:{},bossKills:0,megaBossKills:0,
    missionsDone:{},lastDaily:0,lastSaved:Date.now(),totalLifetime:0,
    cmdCooldown:0, // seconds remaining on cooldown
  });
}
let S=freshState();

/* ---- DERIVED CALCS ---- */
function techMult(eff){let m=1;for(const k in S.tech){const tc=TECHS.find(x=>x.id===k);if(tc&&tc.eff===eff)m*=tc.val;}return m;}
function perkLvl(id){return S.perks[id]||0;}
function milestoneMult(){
  let m=1;
  if(S.rebirths>=1)m*=1.15;
  if(S.rebirths>=5)m*=1.25;
  if(S.rebirths>=10)m*=2.0;
  return m;
}
function rebirthFlat(){return(1+0.15*S.rebirths)*milestoneMult();}
function ppMult(){return S.rebirths>=3?1.5:1.0;}
function oilMultiplier(){
  let gen=1;for(const d of DEFENSE){if(d.oilBonus)gen+=d.oilBonus*(S.def[d.id]||0);}
  return techMult("oil")*Math.pow(1.25,perkLvl("p_oil"))*rebirthFlat()*gen*boostMult();
}
function tapPower(){return(1+S.tapLvl)*techMult("tap")*Math.pow(3,perkLvl("p_tap"))*oilMultiplier();}
function tapUpgradeCost(){return Math.floor(25*Math.pow(1.5,S.tapLvl));}
function oilPerSecRaw(){let s=0;for(const g of GENERATORS)s+=(S.gen[g.id]||0)*g.prod;return s;}
function oilPerSec(){return oilPerSecRaw()*oilMultiplier();}
function killRewardMult(){
  let m=1+0.20*perkLvl("p_kill");
  if(S.rebirths>=2)m*=2;
  if(S.rebirths>=5)m*=2;
  return m;
}
function totalDPS(){
  let s=0;
  for(const d of DEFENSE)s+=(S.def[d.id]||0)*d.dps;
  for(const u of UNITS)s+=(S.unit[u.id]||0)*u.dps;
  s=Math.max(s,1);
  return s*techMult("dps")*Math.pow(1.30,perkLvl("p_dps"))*(1+0.15*S.rebirths)*(S.rebirths>=10?2:1);
}
function baseMaxHP(){
  let s=100;
  for(const d of DEFENSE)s+=(S.def[d.id]||0)*(d.hp||0);
  return s*techMult("hp")*Math.pow(1.30,perkLvl("p_hp"));
}
function offlineCapHours(){return 4+2*perkLvl("p_off");}
function cmdCooldownBase(){return Math.max(30,CMD_COOLDOWN_BASE-20*perkLvl("p_cmd")-(S.rebirths>=2?20:0));}

function bulkCost(list,id,have,k){
  const it=list.find(x=>x.id===id),m=it.mult,b=it.cost*Math.pow(m,have);
  if(k<=0)return 0;
  return b*(Math.pow(m,k)-1)/(m-1);
}
function maxAffordable(list,id,have){
  const it=list.find(x=>x.id===id),m=it.mult,b=it.cost*Math.pow(m,have);
  if(b>S.oil)return 0;
  const k=Math.floor(Math.log(S.oil*(m-1)/b+1)/Math.log(m));
  return Math.max(0,k);
}

function ppGain(){
  if(S.runEarned<REBIRTH_REQ)return 0;
  const ratio=S.runEarned/REBIRTH_REQ;
  return Math.floor(5*Math.pow(ratio,0.5)*ppMult());
}

/* ---- BOOSTS ---- */
let BOOSTS=[];
function boostMult(){let m=1;const now=Date.now();for(const b of BOOSTS)if(b.until>now)m*=b.mult;return m;}

const Audio=(function(){
  let ctx=null,master=null,musicGain=null,musicTimer=null;
  function init(){
    if(ctx)return;
    try{ctx=new(window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);
      musicGain=ctx.createGain();musicGain.gain.value=0.0;musicGain.connect(master);
    }catch(e){ctx=null;}
  }
  function ensure(){if(!ctx)init();if(ctx&&ctx.state==="suspended")ctx.resume();}
  function blip(freq,dur,type,vol,to){
    if(!ctx||!S.sound)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||"square";o.frequency.value=freq;
    g.gain.value=0;g.gain.linearRampToValueAtTime(vol||0.2,ctx.currentTime+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g);g.connect(to||master);o.start();o.stop(ctx.currentTime+dur);
  }
  function noise(dur,vol,fc){
    if(!ctx||!S.sound)return;
    const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    n.buffer=buf;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=fc||1200;
    const g=ctx.createGain();g.gain.value=vol||0.3;n.connect(f);f.connect(g);g.connect(master);n.start();
  }
  function startMusic(){
    const scale=[110,146.8,164.8,196,220];let step=0;
    musicTimer=setInterval(()=>{if(!ctx||!S.music)return;const root=scale[step%scale.length];
      blip(root,1.6,"sine",0.5,musicGain);blip(root*2,1.2,"triangle",0.22,musicGain);
      if(step%2===0)blip(root*3,0.8,"sine",0.1,musicGain);step++;},1500);
  }
  return{
    resume:ensure,
    tap(){blip(360+Math.random()*60,0.07,"square",0.10);},
    buy(){ensure();blip(520,0.06,"square",0.16);setTimeout(()=>blip(780,0.08,"square",0.14),50);},
    money(){blip(880,0.05,"triangle",0.07);},
    shot(){noise(0.06,0.08,2500);},
    explode(){noise(0.35,0.35,500);blip(80,0.3,"sawtooth",0.16);},
    bigExplode(){noise(0.6,0.5,350);blip(55,0.5,"sawtooth",0.25);},
    alarm(){ensure();blip(440,0.18,"square",0.20);setTimeout(()=>blip(330,0.22,"square",0.20),200);},
    win(){ensure();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,"triangle",0.18),i*90));},
    chest(){ensure();[659,784,988,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.22,"triangle",0.20),i*80));},
    raid(){ensure();blip(160,0.5,"sawtooth",0.28);setTimeout(()=>blip(110,0.6,"sawtooth",0.28),150);},
    cmd(){ensure();[880,1100,1320].forEach((f,i)=>setTimeout(()=>blip(f,0.25,"triangle",0.22),i*60));},
    setMusic(on){ensure();if(!ctx)return;S.music=on;musicGain.gain.linearRampToValueAtTime(on?0.16:0.0,ctx.currentTime+0.5);
      if(on&&!musicTimer)startMusic();if(!on&&musicTimer){clearInterval(musicTimer);musicTimer=null;}}
  };
})();

let W=0,H=0,DPR=1,cx=0,cy=0,baseR=40;
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx2.setTransform(DPR,0,0,DPR,0,0);
  ctx2.imageSmoothingEnabled=false;
  cx=W/2;cy=H*0.56;baseR=Math.max(32,Math.min(W,H)*0.13);
}
window.addEventListener("resize",resize);

let enemies=[],projectiles=[],particles=[],floaters=[];
let shotTimer=0,pumpAnim=0;

function spawnEnemy(hp,type,boss){
  const props=ENEMY_PROPS[type]||ENEMY_PROPS.e_soldier;
  const ang=Math.random()*Math.PI*2;
  const rad=Math.max(W,H)*0.65;
  const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad*0.68;
  const baseSpd=26;
  enemies.push({x,y,hp,maxhp:hp,type,boss:!!boss,
    spd:baseSpd*props.spdM*(boss?0.7:1),d:9999,
    dmg:4*props.dmgM*Math.pow(1.16,S.wave),
    armor:props.armor||0,sz:props.sz||18});
}

function getWaveEnemyPool(w){
  const cfg=getTier(w);
  const pool=cfg.pool.slice();
  // escalation: duplicate fast/strong types in later waves
  if(w>30){pool.push(...pool.filter(t2=>ENEMY_PROPS[t2]&&(ENEMY_PROPS[t2].spdM>1.5||ENEMY_PROPS[t2].hpM>4)));}
  return pool;
}

function startWave(){
  S.wave++;enemies=[];
  const cfg=getTier(S.wave);
  const isMega=S.wave%10===0;
  const isBoss=!isMega&&S.wave%5===0;
  const pool=getWaveEnemyPool(S.wave);

  // Count: grows progressively, with surges every 5 waves
  const surge=S.wave%5===0?1.5:1.0;
  const baseCount=Math.floor((3+S.wave*0.9+cfg.cntAdd)*surge);
  const count=Math.min(baseCount,30);

  // HP base: exponential with tier multiplier, but also respects DPS so combat stays tense
  const hpBase=28*Math.pow(1.18,S.wave)*cfg.hpMult;

  for(let i=0;i<count;i++){
    const type=pool[Math.floor(Math.random()*pool.length)];
    const props=ENEMY_PROPS[type]||{hpM:1};
    const hp=hpBase*props.hpM*(0.7+Math.random()*0.6);
    spawnEnemy(hp,type,false);
  }
  if(isMega){
    const props=ENEMY_PROPS.e_megaboss;
    spawnEnemy(hpBase*count*4.0*props.hpM,"e_megaboss",true);
  }else if(isBoss){
    const props=ENEMY_PROPS.e_boss;
    spawnEnemy(hpBase*count*2.0*props.hpM,"e_boss",true);
  }

  S.inWave=true;
  const tname=tierName(cfg.tier);
  const alertTxt=isMega?t("megaBoss")+` [${tname}]`:isBoss?t("bossIncoming")+` [${tname}]`:t("waveIncoming")+" "+S.wave+` [${tname}]`;
  showAlert(alertTxt);
  Audio.alarm();
  document.getElementById("tierBadge").textContent=tname+" · "+t("wave")+" "+S.wave;
}

function killEnemy(e){
  const reward=e.maxhp*0.12*rebirthFlat()*killRewardMult();
  addOil(reward,e.x,e.y);
  if(e.boss){
    if(e.type==="e_megaboss"){S.megaBossKills++;Audio.bigExplode();shake(14);burst(e.x,e.y,60,"#ff8c00");}
    else{S.bossKills++;Audio.explode();shake(8);burst(e.x,e.y,40,"#ff8c00");}
  }else{
    Audio.explode();burst(e.x,e.y,Math.floor(e.sz/3),"#ffae5a");
  }
}

function winWave(){
  S.inWave=false;S.waveCleared=Math.max(S.waveCleared,S.wave);
  S.waveTimer=120;
  const waveRewardMult=S.rebirths>=2?2:1;
  const bonus=(oilPerSec()*10+100)*waveRewardMult;
  addOil(bonus,cx,cy-baseR);
  showAlert(t("waveCleared")+" #"+S.wave);Audio.win();
  if(Math.random()<0.40)giveChest(0.6);
  checkMissions();
}

function raid(){
  S.inWave=false;const lost=S.oil*0.12;S.oil=Math.max(0,S.oil-lost);
  S.baseHP=baseMaxHP();S.waveTimer=120;enemies=[];
  showAlert(t("raided"));flashRed();Audio.raid();shake(10);
  toast("-"+fmt(lost)+" 🛢️");
}

function combatTick(dt){
  if(!S.inWave){
    S.waveTimer-=dt;
    const mhp=baseMaxHP();
    S.baseHP=Math.min(mhp,S.baseHP+mhp*0.06*dt);
    if(S.waveTimer<=0)startWave();
    return;
  }
  const dps=totalDPS();
  // move enemies
  for(const e of enemies){
    const dx=cx-e.x,dy=cy-e.y,dist=Math.hypot(dx,dy);
    e.d=dist;
    if(dist>baseR+8){e.x+=dx/dist*e.spd*dt;e.y+=dy/dist*e.spd*dt;}
    else{
      S.baseHP-=e.dmg*dt;
      if(Math.random()<dt*5)burst(e.x,e.y,3,"#ff5050",1);
    }
  }
  // apply DPS (focus nearest, respect armor)
  enemies.sort((a,b)=>a.d-b.d);
  let dmgPool=dps*dt;
  for(const e of enemies){
    if(dmgPool<=0)break;
    const reduction=1-e.armor;
    const effective=Math.min(e.hp/reduction,dmgPool);
    e.hp-=effective*reduction;
    dmgPool-=effective;
  }
  // shot visuals
  shotTimer-=dt;
  if(shotTimer<=0&&enemies.length){
    shotTimer=0.09;
    const target=enemies[0];
    const slots=turretSlots();
    const n=Math.min(Math.floor(1+slots.length*0.4),4);
    for(let i=0;i<n;i++){
      const sp=slots[Math.floor(Math.random()*slots.length)];
      projectiles.push({x:sp.x,y:sp.y,tx:target.x,ty:target.y,t:0,life:0.20});
      burst(sp.x,sp.y,2,"#ffd24a",1);
    }
    Audio.shot();
  }
  // remove dead
  const alive=[];
  for(const e of enemies){if(e.hp>0)alive.push(e);else killEnemy(e);}
  enemies=alive;
  if(S.baseHP<=0){raid();return;}
  if(enemies.length===0)winWave();
}

function turretSlots(){
  const n=Math.max(3,Math.min(10,2+(S.def.turret||0)+(S.def.hangar||0)));
  const arr=[];
  for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2-Math.PI/2;arr.push({x:cx+Math.cos(a)*baseR*0.95,y:cy+Math.sin(a)*baseR*0.65});}
  return arr;
}

/* particles / floaters */
function burst(x,y,n,color,small){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(small?18:45)*Math.random()+8;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-18,life:0.5+Math.random()*0.4,max:0.9,color,size:small?2:2+Math.random()*3});
  }
}
function smoke(x,y){particles.push({x,y,vx:(Math.random()-0.5)*8,vy:-12-Math.random()*8,life:1.2,max:1.2,color:"#5a5a5a",size:3,smoke:true});}
function addFloater(x,y,txt){floaters.push({x,y,txt,life:1.0});}

let shakeT=0,shakeMag=0;
function shake(m){shakeMag=m;shakeT=0.28;}
function flashRed(){const f=document.getElementById("flash");f.style.transition="none";f.style.opacity=0.6;requestAnimationFrame(()=>{f.style.transition="opacity .6s";f.style.opacity=0;});}
let alertT=0;
function showAlert(txt){const a=document.getElementById("alert");a.textContent=txt;a.classList.add("show");alertT=2.5;}

function render(dt){
  let ox=0,oy=0;
  if(shakeT>0){shakeT-=dt;ox=(Math.random()-0.5)*shakeMag;oy=(Math.random()-0.5)*shakeMag;}
  ctx2.save();ctx2.translate(ox,oy);
  // ground
  const g=ctx2.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1a1d18");g.addColorStop(0.4,"#2d2a1d");g.addColorStop(1,"#3a3320");
  ctx2.fillStyle=g;ctx2.fillRect(-20,-20,W+40,H+40);
  ctx2.fillStyle="rgba(0,0,0,.1)";
  for(let i=0;i<5;i++){const yy=H*0.18+i*H*0.15;ctx2.fillRect(0,yy,W,2);}
  // base shadow
  ctx2.fillStyle="rgba(0,0,0,.3)";
  ctx2.beginPath();ctx2.ellipse(cx,cy+baseR*0.55,baseR*1.15,baseR*0.45,0,0,Math.PI*2);ctx2.fill();
  drawGenerators();
  // HQ
  const hqw=baseR*1.7,hqh=baseR*1.35;
  ctx2.drawImage(SPRITES.hq,cx-hqw/2,cy-hqh*0.72,hqw,hqh);
  // turrets
  const slots=turretSlots();
  for(const sp of slots){
    let ang=-Math.PI/2;
    if(enemies.length)ang=Math.atan2(enemies[0].y-sp.y,enemies[0].x-sp.x);
    ctx2.save();ctx2.translate(sp.x,sp.y);ctx2.rotate(ang+Math.PI/2);
    ctx2.drawImage(SPRITES.turret,-8,-8,16,16);ctx2.restore();
  }
  drawUnits();
  // enemies
  for(const e of enemies){
    const spr=SPRITES[e.type]||SPRITES.e_soldier;
    const w=e.sz,h=Math.floor(e.sz*0.8);
    ctx2.drawImage(spr,e.x-w/2,e.y-h/2,w,h);
    // HP bar
    const bw=e.sz+4;
    ctx2.fillStyle="#000";ctx2.fillRect(e.x-bw/2,e.y-h/2-6,bw,3);
    ctx2.fillStyle=e.boss?"#ff8c00":e.armor>0?"#c8a020":"#ff4d4d";
    ctx2.fillRect(e.x-bw/2,e.y-h/2-6,bw*(e.hp/e.maxhp),3);
    // armor indicator
    if(e.armor>0){ctx2.fillStyle="rgba(255,200,0,.35)";ctx2.fillRect(e.x-w/2,e.y-h/2,w,h);}
  }
  // projectiles
  ctx2.strokeStyle="#ffe08a";ctx2.lineWidth=2;ctx2.lineCap="round";
  for(const p of projectiles){
    const px2=p.x+(p.tx-p.x)*(p.t/p.life),py2=p.y+(p.ty-p.y)*(p.t/p.life);
    ctx2.beginPath();ctx2.moveTo(px2,py2);ctx2.lineTo(px2-(p.tx-p.x)*0.05,py2-(p.ty-p.y)*0.05);ctx2.stroke();
  }
  // particles
  for(const pt of particles){
    ctx2.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx2.fillStyle=pt.color;ctx2.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  ctx2.globalAlpha=1;
  // floaters
  ctx2.font="bold 11px 'Courier New',monospace";ctx2.textAlign="center";
  for(const f of floaters){ctx2.globalAlpha=Math.max(0,f.life);ctx2.fillStyle="#ffd24a";ctx2.fillText(f.txt,f.x,f.y);}
  ctx2.globalAlpha=1;
  ctx2.restore();
}
function drawGenerators(){
  let ring=0,idx=0;
  for(const gdef of GENERATORS){
    const cnt=S.gen[gdef.id]||0;if(cnt<=0)continue;
    const show=Math.min(cnt,6);
    const rad=baseR*1.55+ring*24;
    for(let i=0;i<show;i++){
      const a=(i/Math.max(show,3))*Math.PI*2+idx*0.6+pumpAnim*0.015;
      const x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*0.6;
      const bob=Math.sin(pumpAnim*3+i)*1.5;
      ctx2.drawImage(SPRITES[gdef.sprite],x-8,y-8+bob,16,16);
      if(Math.random()<0.015)smoke(x,y-7);
    }
    ring++;idx++;
  }
}
function drawUnits(){
  let placed=0;
  for(const u of UNITS){
    const cnt=S.unit[u.id]||0;if(cnt<=0)continue;
    const show=Math.min(cnt,4);
    for(let i=0;i<show;i++){
      const a=Math.PI/2+(placed-3)*0.3;
      const x=cx+Math.cos(a)*baseR*1.12,y=cy+Math.sin(a)*baseR*0.78+8;
      const spr=SPRITES[u.sprite];
      ctx2.drawImage(spr,x-spr.width/2,y-spr.height/2,spr.width,spr.height);
      placed++;if(placed>=8)return;
    }
  }
}
function updateParticles(dt){
  for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.smoke)p.vy+=115*dt;else p.vy-=6*dt;}
  particles=particles.filter(p=>p.life>0);if(particles.length>280)particles.splice(0,particles.length-280);
  for(const p of projectiles){p.t+=dt;if(p.t>=p.life)burst(p.tx,p.ty,3,"#ffae5a",1);}
  projectiles=projectiles.filter(p=>p.t<p.life);
  for(const f of floaters){f.life-=dt;f.y-=22*dt;}
  floaters=floaters.filter(f=>f.life>0);
}

/* =====================================================================
   ECONOMY ACTIONS
   ===================================================================== */
function addOil(amount,x,y){
  S.oil+=amount;S.runEarned+=amount;S.totalLifetime+=amount;
  if(x!==undefined&&amount>0&&Math.random()<0.45)addFloater(x,y,"+"+fmt(amount));
}
function manualTap(px2,py2){
  const p=tapPower();addOil(p,px2,py2);
  burst(px2,py2,5,"#1a1410");burst(px2,py2,2,"#3a2a18",1);
  Audio.tap();Audio.money();
}
function useCommanderAbility(){
  if(S.cmdCooldown>0||S.rebirths<1)return;
  const mult=3+Math.floor(S.rebirths*0.3);
  BOOSTS.push({mult,until:Date.now()+CMD_DURATION*1000});
  S.cmdCooldown=cmdCooldownBase();
  Audio.cmd();shake(4);
  toast("⚡ "+t("boostX2_prefix"||"x")+mult+" ("+CMD_DURATION+"s)");
}

function buyFrom(list,store,id){
  const have=store[id]||0;
  let k=1;
  if(BUYMODE==="10")k=Math.min(10,maxAffordable(list,id,have));
  else if(BUYMODE==="max")k=maxAffordable(list,id,have);
  if(k<=0){toast("⚠ "+t("notEnough"));return;}
  const cost=bulkCost(list,id,have,k);
  if(S.oil<cost){toast("⚠ "+t("notEnough"));return;}
  S.oil-=cost;store[id]=have+k;
  Audio.buy();checkMissions();renderPanel();refreshHUD();
}
function buyGen(id){buyFrom(GENERATORS,S.gen,id);}
function buyDef(id){buyFrom(DEFENSE,S.def,id);}
function buyUnit(id){buyFrom(UNITS,S.unit,id);}
function upgradeTap(){
  const c=tapUpgradeCost();
  if(S.oil<c){toast("⚠ "+t("notEnough"));return;}
  S.oil-=c;S.tapLvl++;Audio.buy();renderPanel();refreshHUD();
}
function buyTech(id){
  const tc=TECHS.find(x=>x.id===id);if(!tc||S.tech[id])return;
  if(S.runEarned<tc.req||S.oil<tc.cost){toast("⚠ "+t("notEnough"));return;}
  S.oil-=tc.cost;S.tech[id]=true;Audio.buy();checkMissions();renderPanel();refreshHUD();
}
function buyPerk(id){
  const lvl=perkLvl(id),cost=PERK_COST(lvl);
  if(S.pp<cost){toast("⚠ PP insuficientes");return;}
  S.pp-=cost;S.perks[id]=lvl+1;Audio.buy();renderPanel();refreshHUD();
}
function doRebirth(){
  const gain=ppGain();if(gain<=0)return;
  S.pp+=gain;S.rebirths++;
  const keep={lang:S.lang,sound:S.sound,music:S.music,rebirths:S.rebirths,pp:S.pp,perks:S.perks,
    bossKills:S.bossKills,megaBossKills:S.megaBossKills,missionsDone:S.missionsDone,
    lastDaily:S.lastDaily,totalLifetime:S.totalLifetime,cmdCooldown:0};
  S=Object.assign(freshRun(),keep,{lastSaved:Date.now()});
  enemies=[];projectiles=[];particles=[];BOOSTS=[];
  closeModal();Audio.win();checkMissions();switchTab("extract");refreshHUD();
  toast("+"+gain+" PP 🎖️  ·  Renacer #"+S.rebirths);
}

/* missions / chests / daily */
function checkMissions(){for(const m of MISSIONS)if(!S.missionsDone[m.id]&&m.chk(S)){}updateTabBadges();}
function claimMission(id){
  const m=MISSIONS.find(x=>x.id===id);if(!m||S.missionsDone[id]||!m.chk(S))return;
  S.missionsDone[id]=true;if(m.r>0)addOil(m.r,cx,cy-baseR);
  Audio.chest();toast(t("reward")+": +"+fmt(m.r)+" 🛢️");
  renderPanel();refreshHUD();updateTabBadges();
}
function giveChest(scaleMin){
  const mins=(scaleMin||1)*(2+Math.random()*8);
  const reward=Math.max(oilPerSec()*60*mins,100*Math.pow(2,S.rebirths));
  addOil(reward,cx,cy-baseR);
  if(Math.random()<0.45){const mult=2+Math.floor(Math.random()*3);BOOSTS.push({mult,until:Date.now()+90000});toast("⚡ x"+mult+" (90s)");}
  return reward;
}
function claimDaily(){
  if(Date.now()-S.lastDaily<20*3600*1000)return;
  S.lastDaily=Date.now();
  const reward=giveChest(3);Audio.chest();
  openModal(`<h2>🎁 ${t("chestWon")}</h2><p class="num">+${fmt(reward)} 🛢️</p>
    <div class="row"><button class="big-btn" onclick="closeModal()">${t("close")}</button></div>`);
  renderPanel();refreshHUD();updateTabBadges();
}

/* =====================================================================
   UI
   ===================================================================== */
let CURTAB="extract",BUYMODE="1";
const TABS=[
  {id:"extract",label:"tabExtract"},{id:"defense",label:"tabDefense"},
  {id:"units",label:"tabUnits"},{id:"tech",label:"tabTech"},
  {id:"missions",label:"tabMissions"},{id:"rebirth",label:"tabRebirth"},
];
function buildTabs(){
  const el=document.getElementById("tabs");el.innerHTML="";
  for(const tb of TABS){
    const b=document.createElement("button");
    b.className="tab"+(tb.id===CURTAB?" active":"");b.dataset.id=tb.id;
    b.innerHTML=`<span>${t(tb.label)}</span><span class="badge" data-badge="${tb.id}" style="display:none"></span>`;
    b.onclick=()=>switchTab(tb.id);el.appendChild(b);
  }
  updateTabBadges();
}
function switchTab(id){CURTAB=id;document.querySelectorAll(".tab").forEach(t2=>t2.classList.toggle("active",t2.dataset.id===id));renderPanel();}
function updateTabBadges(){
  let mc=0;for(const m of MISSIONS)if(!S.missionsDone[m.id]&&m.chk(S))mc++;
  document.querySelectorAll("[data-badge]").forEach(b=>{
    if(b.dataset.badge==="missions"&&mc>0){b.style.display="inline-block";b.textContent=mc;}
    else b.style.display="none";
  });
}

/* ---- priceBtn: ALWAYS adds data-act so buttons always respond ---- */
function priceBtn(cost,onclick,label){
  const can=S.oil>=cost;
  return `<button class="buy ${can?"":"cant"}" data-act="${onclick}">
    ${label||t("buy")}<span class="c">${fmt(cost)} 🛢️</span></button>`;
}
function buyCountDisplay(list,id,have){
  if(BUYMODE==="1")return 1;
  if(BUYMODE==="10")return Math.max(1,Math.min(10,maxAffordable(list,id,have)));
  return Math.max(1,maxAffordable(list,id,have));
}

function card(spr,nameHtml,subHtml,btnHtml,extraClass){
  return `<div class="card ${extraClass||""}">
    <canvas class="spr" width="16" height="16" data-spr="${spr}"></canvas>
    <div class="info"><div class="nm">${nameHtml}</div><div class="sub">${subHtml}</div></div>
    ${btnHtml}</div>`;
}

function renderPanel(){
  const c=document.getElementById("content");let html="";
  if(CURTAB==="extract"){
    html+=`<div class="section-note">${t("extractNote")}</div>`;
    const tc=tapUpgradeCost();
    html+=card("pump",t("upgradeTap")+` <span class="owned-pill">Nv.${S.tapLvl}</span>`,
      `<b>+${fmt(tapPower())}</b> ${t("each")}`,priceBtn(tc,"tap","+1"));
    for(const g of GENERATORS){
      const have=S.gen[g.id]||0,k=buyCountDisplay(GENERATORS,g.id,have);
      const cost=bulkCost(GENERATORS,g.id,have,k);
      const sub=`<span class="owned-pill">${have}</span><b>+${fmt(g.prod*oilMultiplier())}</b>/s`;
      html+=card(g.sprite,nm(g.name),sub,priceBtn(cost,"gen:"+g.id,t("buy")+(k>1?` x${k}`:"")));
    }
  }else if(CURTAB==="defense"){
    html+=`<div class="section-note">${t("defenseNote")}</div>`;
    for(const d of DEFENSE){
      const have=S.def[d.id]||0,k=buyCountDisplay(DEFENSE,d.id,have);
      const cost=bulkCost(DEFENSE,d.id,have,k);
      const bits=[`<span class="owned-pill">${have}</span>`];
      if(d.dps)bits.push(`<b>+${fmt(d.dps*techMult("dps")*Math.pow(1.3,perkLvl("p_dps")))}</b>${t("dmg")}`);
      if(d.hp)bits.push(`+${fmt(d.hp*techMult("hp"))}${t("hp")}`);
      if(d.oilBonus)bits.push(`+${Math.round(d.oilBonus*100)}%🛢️`);
      html+=card(d.sprite,nm(d.name),bits.join(" "),priceBtn(cost,"def:"+d.id,t("buy")+(k>1?` x${k}`:"")));
    }
  }else if(CURTAB==="units"){
    html+=`<div class="section-note">${t("unitsNote")}</div>`;
    for(const u of UNITS){
      const have=S.unit[u.id]||0,k=buyCountDisplay(UNITS,u.id,have);
      const cost=bulkCost(UNITS,u.id,have,k);
      const sub=`<span class="owned-pill">${have}</span><b>+${fmt(u.dps*techMult("dps")*Math.pow(1.3,perkLvl("p_dps")))}</b>${t("dmg")}`;
      html+=card(u.sprite,nm(u.name),sub,priceBtn(cost,"unit:"+u.id,t("buy")+(k>1?` x${k}`:"")));
    }
  }else if(CURTAB==="tech"){
    html+=`<div class="section-note">${t("techNote")}</div>`;
    for(const tech of TECHS){
      const done=!!S.tech[tech.id],unlocked=S.runEarned>=tech.req;
      const label={oil:"🛢️ x"+tech.val,tap:"⛏️ x"+tech.val,hp:"🛡️ x"+tech.val,dps:"💥 x"+tech.val}[tech.eff];
      let btn;
      if(done)btn=`<button class="buy" style="background:#1d4427;color:#5dff8f;box-shadow:0 3px 0 #0c2113">✓</button>`;
      else if(!unlocked)btn=`<button class="buy cant">${t("locked")}<span class="c">${fmt(tech.req)}🛢️</span></button>`;
      else btn=priceBtn(tech.cost,"tech:"+tech.id,t("buy"));
      html+=card("genpow",nm(tech.name),label,btn,done?"done":(unlocked?"":"locked"));
    }
  }else if(CURTAB==="missions"){
    let any=false;
    for(const m of MISSIONS){
      const done=!!S.missionsDone[m.id],ready=!done&&m.chk(S);
      any=any||!done;
      let btn;
      if(done)btn=`<button class="buy" style="background:#1d4427;color:#5dff8f;box-shadow:0 3px 0 #0c2113">✓</button>`;
      else if(ready)btn=`<button class="buy" data-act="mission:${m.id}">${t("claim")}<span class="c">+${fmt(m.r)}🛢️</span></button>`;
      else btn=`<button class="buy cant">${t("reward")}<span class="c">+${fmt(m.r)}🛢️</span></button>`;
      html+=card(ready?"quantum":"radar",nm(m.d),done?"✓":ready?"⭐ ¡Listo!":"…",btn,done?"done":"");
    }
    if(!any)html+=`<div class="section-note">${t("noMissions")}</div>`;
    const wait=20*3600*1000-(Date.now()-S.lastDaily);
    if(wait<=0){html+=`<button class="big-btn" data-act="daily">🎁 ${t("daily")} — ${t("openChest")}</button>`;}
    else{html+=`<button class="big-btn dis">🎁 ${t("dailyWait").replace("{x}",fmtTime(wait/1000))}</button>`;}
  }else if(CURTAB==="rebirth"){
    const gain=ppGain();
    html+=`<div class="card" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="nm" style="color:#ffd24a">⚔️ ${t("rebirthTitle")}</div>
      <div class="sub" style="line-height:1.4">${t("rebirthDesc")}</div></div>`;
    html+=`<div class="card"><div class="info">
      <div class="nm">${t("pp")}: <b style="color:#ffd24a">${S.pp}</b> · ${t("rebirths")}: <b>${S.rebirths}</b></div>
      <div class="sub">${t("totalDps")}: ${fmt(totalDPS())} · ${t("mult")}: x${fmt(oilMultiplier())}</div></div></div>`;
    // Progress to rebirth
    const pct=Math.min(100,S.runEarned/REBIRTH_REQ*100);
    html+=`<div style="margin:4px 0 8px">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px">
        <span>${fmt(S.runEarned)} / ${fmt(REBIRTH_REQ)} 🛢️</span><span>${Math.floor(pct)}%</span></div>
      <div style="height:8px;background:#0a0f0a;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#ffd24a,#ff8c00);transition:width .3s"></div></div></div>`;
    if(S.runEarned>=REBIRTH_REQ){
      html+=`<button class="big-btn" data-act="rebirth">${t("rebirthBtn")} — +${gain} PP 🎖️</button>`;
    }else{
      html+=`<button class="big-btn dis">${t("rebirthNeed").replace("{x}",fmt(REBIRTH_REQ))}</button>`;
    }
    // Milestones
    html+=`<div class="section-note" style="margin-top:14px;color:var(--amber);font-weight:bold">🏆 ${t("milestones")}</div>`;
    for(const ms of REBIRTH_MILESTONES){
      const done=S.rebirths>=ms.rb,next=!done&&(S.rebirths===ms.rb-1);
      html+=`<div class="milestone">
        <div class="dot ${done?"done":next?"next":""}"></div>
        <div style="font-size:11px;flex:1"><b style="color:${done?"#5dff8f":next?"#ffd24a":"var(--dim)"}">Renacer ${ms.rb}${done?" ✓":""}</b><br>
        <span style="color:var(--dim)">${nm(ms.d)}</span></div></div>`;
    }
    // Prestige shop
    html+=`<div class="section-note" style="margin-top:14px;color:var(--amber);font-weight:bold">🎖️ ${t("prestigeShop")}</div>`;
    html+=`<div class="section-note">PP disponibles: <b style="color:#ffd24a">${S.pp}</b></div>`;
    for(const p of PERKS){
      const lvl=perkLvl(p.id),cost=PERK_COST(lvl),can=S.pp>=cost;
      const btn=`<button class="buy ${can?"":"cant"}" data-act="perk:${p.id}">${t("lvl")} ${lvl}→${lvl+1}<span class="c">${cost} PP</span></button>`;
      html+=card("fusion",t(p.name)+` <span class="owned-pill">${t("lvl")} ${lvl}</span>`,t(p.desc),btn);
    }
  }
  c.innerHTML=html;
  // draw sprites
  c.querySelectorAll("[data-spr]").forEach(cv=>{
    const s=SPRITES[cv.dataset.spr];if(!s)return;
    const g=cv.getContext("2d");g.imageSmoothingEnabled=false;g.clearRect(0,0,16,16);g.drawImage(s,0,0,16,16);
  });
  // wire ALL buttons with data-act
  c.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.act;
      if(a==="tap")upgradeTap();
      else if(a==="daily")claimDaily();
      else if(a==="rebirth")confirmRebirth();
      else if(a.startsWith("gen:"))buyGen(a.slice(4));
      else if(a.startsWith("def:"))buyDef(a.slice(4));
      else if(a.startsWith("unit:"))buyUnit(a.slice(5));
      else if(a.startsWith("tech:"))buyTech(a.slice(5));
      else if(a.startsWith("perk:"))buyPerk(a.slice(5));
      else if(a.startsWith("mission:"))claimMission(a.slice(8));
    };
  });
}

/* HUD */
let hudAcc=0,panelAcc=0;
function refreshHUD(){
  document.getElementById("hOil").textContent=fmt(S.oil)+" 🛢️";
  document.getElementById("hRate").textContent=fmt(oilPerSec())+"/s";
  document.getElementById("hMult").textContent="x"+fmt(oilMultiplier());
  document.getElementById("hWave").textContent=S.inWave?(S.wave+"⚔"):(S.wave>0?S.wave:"—");
  const hp=Math.max(0,S.baseHP),mhp=baseMaxHP(),pct=Math.max(0,Math.min(100,hp/mhp*100));
  document.getElementById("hHpFill").style.width=pct+"%";
  document.getElementById("hHpFill").style.background=pct<30?"linear-gradient(90deg,#c0392b,#ff4d4d)":"linear-gradient(90deg,#2bd05a,#5dff8f)";
  document.getElementById("hHpTxt").textContent=S.inWave?t("defending"):Math.round(pct)+"%";
  const th=document.getElementById("tapHint");
  if(!S.inWave&&S.wave>0)th.textContent=t("nextWave").replace("{x}",Math.ceil(S.waveTimer));
  else if(S.inWave)th.textContent=t("totalDps")+": "+fmt(totalDPS());
  else th.textContent=t("tapHint");
  // boosts display
  const bx=document.getElementById("boosts");const now=Date.now();
  BOOSTS=BOOSTS.filter(b=>b.until>now);
  bx.innerHTML=BOOSTS.map(b=>`<span class="boost-tag">⚡x${b.mult} ${Math.ceil((b.until-now)/1000)}s</span>`).join("");
  // commander button
  const cb=document.getElementById("cmdBtn");
  if(S.rebirths>=1){
    cb.style.display="flex";
    if(S.cmdCooldown<=0){cb.className="icon-btn on ready";cb.innerHTML=`⚡ ${t("cmdReady")}`;cb.style.width="auto";cb.style.padding="3px 10px";}
    else{cb.className="icon-btn";cb.innerHTML=`⚡ ${Math.ceil(S.cmdCooldown)}s`;cb.style.width="auto";cb.style.padding="3px 8px";}
  }else{cb.style.display="none";}
}

/* modal helpers */
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");}
function confirmRebirth(){
  openModal(`<h2>⚔️ ${t("rebirthTitle")}</h2><p>${t("rebirthConfirm")}</p>
    <p>${t("rebirthGain")}: <span class="num">+${ppGain()} PP</span></p>
    <div class="row"><button class="big-btn ghost" onclick="closeModal()">${t("cancel")}</button>
    <button class="big-btn" id="doRb">${t("rebirthBtn")}</button></div>`);
  document.getElementById("doRb").onclick=doRebirth;
}
function openSettings(){
  openModal(`<h2>⚙ ${t("settings")}</h2>
    <div class="card"><div class="info"><div class="nm">🌐 Idioma / Language</div></div>
      <button class="buy" id="mLang">${LANG==="es"?"English":"Español"}</button></div>
    <div class="card"><div class="info"><div class="nm">🔊 ${t("sound")}</div></div>
      <button class="buy ${S.sound?"":"cant"}" id="mSound">${S.sound?"ON":"OFF"}</button></div>
    <div class="card"><div class="info"><div class="nm">🎵 ${t("music")}</div></div>
      <button class="buy ${S.music?"":"cant"}" id="mMusic">${S.music?"ON":"OFF"}</button></div>
    <button class="big-btn" id="mSave">💾 ${t("save")}</button>
    <button class="big-btn ghost" id="mReset" style="margin-top:7px;color:#ff6b6b">🗑️ ${t("reset")}</button>
    <div class="section-note" style="margin-top:10px;text-align:center">${t("credits")}</div>
    <button class="big-btn ghost" onclick="closeModal()" style="margin-top:7px">${t("close")}</button>`);
  document.getElementById("mLang").onclick=()=>{setLang(LANG==="es"?"en":"es");openSettings();};
  document.getElementById("mSound").onclick=()=>{S.sound=!S.sound;document.getElementById("bSound").textContent=S.sound?"🔊":"🔇";document.getElementById("bSound").classList.toggle("on",S.sound);openSettings();};
  document.getElementById("mMusic").onclick=()=>{Audio.setMusic(!S.music);openSettings();};
  document.getElementById("mSave").onclick=()=>{save();toast(t("saved"));};
  document.getElementById("mReset").onclick=()=>{
    openModal(`<h2>🗑️ ${t("reset")}</h2><p>${t("resetQ")}</p>
      <div class="row"><button class="big-btn ghost" onclick="closeModal()">${t("cancel")}</button>
      <button class="big-btn red" id="rcfm">${t("yes")}</button></div>`);
    document.getElementById("rcfm").onclick=()=>wipe();
  };
}

/* lang */
function setLang(l){
  LANG=l;S.lang=l;document.documentElement.lang=l;
  document.getElementById("bLang").textContent=l.toUpperCase();
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  buildTabs();renderPanel();refreshHUD();
}

/* toast */
let toastT=0;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");toastT=2.2;}

/* =====================================================================
   SAVE / LOAD
   ===================================================================== */
const SAVE_KEY="DEFTYCOON_v2";
let storageOK=true;
function save(){
  S.lastSaved=Date.now();S.lang=LANG;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}
function load(){
  let raw=null;try{raw=localStorage.getItem(SAVE_KEY);}catch(e){storageOK=false;}
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);
    S=Object.assign(freshState(),d);
    S.gen=S.gen||{};S.def=S.def||{};S.unit=S.unit||{};S.tech=S.tech||{};
    S.perks=S.perks||{};S.missionsDone=S.missionsDone||{};
    LANG=S.lang||"es";
    const now=Date.now(),dtOff=Math.min((now-(S.lastSaved||now))/1000,offlineCapHours()*3600);
    if(dtOff>30){const earn=oilPerSec()*dtOff*0.5;if(earn>1)pendingOffline={earn,dt:dtOff};}
    S.inWave=false;S.baseHP=Math.min(S.baseHP||100,baseMaxHP());
    if(!S.cmdCooldown)S.cmdCooldown=0;
    return true;
  }catch(e){return false;}
}
function wipe(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  S=freshState();BOOSTS=[];enemies=[];projectiles=[];particles=[];
  closeModal();setLang("es");switchTab("extract");refreshHUD();save();
}
let pendingOffline=null;
function showOffline(){
  if(!pendingOffline)return;
  const{earn,dt}=pendingOffline;pendingOffline=null;
  addOil(earn);
  openModal(`<h2>🪖 ${t("offlineTitle")}</h2>
    <p>${t("offlineBody").replace("{t}",fmtTime(dt))}</p>
    <p class="num">+${fmt(earn)} 🛢️</p>
    <div class="row"><button class="big-btn" onclick="closeModal()">${t("collect")}</button></div>`);
  refreshHUD();
}

/* =====================================================================
   INPUT
   ===================================================================== */
function stagePoint(ev){
  const r=canvas.getBoundingClientRect();
  const e=ev.touches?ev.touches[0]||ev.changedTouches[0]:ev;
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function onTap(ev){
  ev.preventDefault();Audio.resume();
  const p=stagePoint(ev);manualTap(p.x,p.y);
}
canvas.addEventListener("touchstart",onTap,{passive:false});
canvas.addEventListener("mousedown",e=>{if(e.button===0)onTap(e);});
document.getElementById("bLang").onclick=()=>{Audio.resume();setLang(LANG==="es"?"en":"es");};
document.getElementById("bSound").onclick=()=>{Audio.resume();S.sound=!S.sound;
  const b=document.getElementById("bSound");b.textContent=S.sound?"🔊":"🔇";b.classList.toggle("on",S.sound);};
document.getElementById("bMenu").onclick=()=>{Audio.resume();openSettings();};
document.getElementById("cmdBtn").onclick=()=>{Audio.resume();useCommanderAbility();};
document.querySelectorAll(".bm").forEach(b=>b.onclick=()=>{
  BUYMODE=b.dataset.bm;document.querySelectorAll(".bm").forEach(x=>x.classList.toggle("active",x===b));renderPanel();
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
window.addEventListener("beforeunload",save);
document.body.addEventListener("touchstart",()=>Audio.resume(),{once:true});
document.body.addEventListener("mousedown",()=>Audio.resume(),{once:true});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now(),saveAcc=0;
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;
  pumpAnim+=dt;
  // idle production
  addOil(oilPerSec()*dt);
  // commander cooldown
  if(S.cmdCooldown>0)S.cmdCooldown=Math.max(0,S.cmdCooldown-dt);
  // combat
  combatTick(dt);
  updateParticles(dt);
  // alert
  if(alertT>0){alertT-=dt;if(alertT<=0)document.getElementById("alert").classList.remove("show");}
  if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById("toast").classList.remove("show");}
  // render
  render(dt);
  // throttle HUD
  hudAcc+=dt;if(hudAcc>0.1){hudAcc=0;refreshHUD();}
  // throttle panel refresh (keeps button states updated)
  panelAcc+=dt;if(panelAcc>3.0){panelAcc=0;renderPanel();}
  // autosave every 5s
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(loop);
}

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  buildSprites();resize();
  const loaded=load();
  setLang(LANG);
  if(!S.sound){document.getElementById("bSound").textContent="🔇";document.getElementById("bSound").classList.remove("on");}
  buildTabs();switchTab("extract");refreshHUD();
  if(!loaded)S.waveTimer=30;
  if(S.wave===0&&S.waveTimer>120)S.waveTimer=120;
  if(pendingOffline)setTimeout(showOffline,500);
  if(!storageOK)setTimeout(()=>toast("⚠ "+(LANG==="es"?"Descarga el .html para guardar":"Download .html to save")),900);
  requestAnimationFrame(loop);
}
window.addEventListener("load",()=>setTimeout(resize,60));
init();
</script>
